defaults:
    task: topic

tasks:
    topic:
        labels: [E, S_labor, S_community, S_product, G, Non_ESG]

        seed: 42

        model:
            name: vinai/phobert-base
            max_length: 128
            word_segment: true
            sentence_transformer: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

        data:
            use_context_prev: true
            use_context_next: true

        paths:
            train_data: demo/data/labels/topic/train.parquet
            val_data: demo/data/labels/topic/val.parquet
            test_data: demo/data/labels/topic/test.parquet
            output_dir: demo/outputs/models/topic_classifier

        training:
            epochs: 5
            train_batch_size: 16
            eval_batch_size: 32
            learning_rate: 1.951e-5
            weight_decay: 0.0289
            warmup_ratio: 0.1
            use_class_weights: true
            weight_method: sqrt_inverse
            gradient_accumulation_steps: 1
            max_grad_norm: 1.0
            label_smoothing_factor: 0.0
            fp16: auto
            metric_for_best_model: macro_f1

        early_stopping:
            enabled: true
            patience: 2
            threshold: 0.0

        neuro_symbolic:
            constraint_lambda: 0.2798
            exactly_one_weight: 1.0
            implication_weight: 0.5
            negation_weight: 0.5

    action:
        labels: [Implemented, Planning, Indeterminate]

        seed: 42

        model:
            name: vinai/phobert-base
            max_length: 128
            word_segment: true
            sentence_transformer: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

        data:
            use_context_prev: true
            use_context_next: true

        paths:
            train_data: demo/data/labels/action/train.parquet
            val_data: demo/data/labels/action/val.parquet
            test_data: demo/data/labels/action/test.parquet
            output_dir: demo/outputs/models/action_classifier

        training:
            epochs: 5
            train_batch_size: 16
            eval_batch_size: 32
            learning_rate: 2.004e-5
            weight_decay: 0.0456
            warmup_ratio: 0.1
            use_class_weights: true
            weight_method: sqrt_inverse
            gradient_accumulation_steps: 1
            max_grad_norm: 1.0
            label_smoothing_factor: 0.0
            fp16: auto
            metric_for_best_model: macro_f1

        early_stopping:
            enabled: true
            patience: 2
            threshold: 0.0

        neuro_symbolic:
            constraint_lambda: 0.1798
            exactly_one_weight: 1.0
            implication_weight: 0.5
            negation_weight: 0.5
