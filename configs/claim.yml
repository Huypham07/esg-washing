# M2 - commitment + specificity multi-task (spec 02 #2)
backbone: vinai/phobert-base
max_length: 256
word_segment: true
heads: [commitment, specificity]   # aux head env_claims da BO (quyet dinh 2026-06-12)
augment_action_500: true         # commitment-side positives cho khoang trong S/G
augment_ml_promise: true         # data/translate/ml_promise_vi.csv da co (1200 EN+FR+JA dich VI)
en_backbone: roberta-base        # upper-bound E2 (train+test EN goc)
zero_shot_backbone: xlm-roberta-base
tune:                            # Optuna TPE + MedianPruner (esgwash.models.tuning)
  max_epochs: 10
  space:
    lr: [1.0e-5, 5.0e-5]
    batch_size: [16, 32]
    warmup_ratio: [0.0, 0.2]
    weight_decay: [1.0e-3, 0.1]
    dropout: [0.05, 0.3]
train:
  lr: 2.0e-5
  batch_size: 32
  epochs: 5
  warmup_ratio: 0.1
  weight_decay: 0.01
  seeds: [42, 43, 44, 45, 46]
fallback_single_task: true       # train ca 2 phuong an, chon theo dev
data:
  dir: data/translate
output_dir: outputs/models/claim
